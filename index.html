<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What does this page know about you?</title>
<meta name="description" content="Click once and see the basics every website can see: your IP, time, battery state, device type, OS and browser. Nothing is stored or sent anywhere.">
</head>
<body style="text-align:center;font-family:sans-serif">
</head>
<body>
<div class="page-wrap">
<header class="masthead">
<h1>What does this page know about you?</h1>
</header>

<div id="tool-gate"><button id="btn-reveal" class="btn btn-fill">Show my info</button></div>

<div id="tool-root" style="display:none">
<main id="output">
<div class="section">
<h2>Results</h2>
<table><tbody>
<tr><td class="key">Public IP</td><td class="value" id="v-ip">loading…</td></tr>
<tr><td class="key">Local time</td><td class="value" id="v-time">…</td></tr>
<tr><td class="key">Timezone</td><td class="value" id="v-tz">…</td></tr>
<tr><td class="key">Device type</td><td class="value" id="v-device">…</td></tr>
<tr><td class="key">Operating system</td><td class="value" id="v-os">…</td></tr>
<tr><td class="key">Browser</td><td class="value" id="v-browser">…</td></tr>
<tr><td class="key">Battery</td><td class="value" id="v-battery">…</td></tr>
</tbody></table>
</div>
</main>
</div>

<p class="colophon">Just HTML / JS — view source if you want.</p>
</div>
<script src="script.js"></script>
</body>
</html>
